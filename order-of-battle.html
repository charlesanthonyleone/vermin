<style>

.scene{position:absolute;inset:0;overflow:hidden;background:#070102}

.sframe>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sframe>.sfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
.moon-glow{position:absolute;width:16%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,215,200,.34),rgba(255,90,70,.16) 32%,transparent 68%);mix-blend-mode:screen;animation:moonG 6s ease-in-out infinite alternate;pointer-events:none}

.clouds{position:absolute;left:0;right:0;top:0;overflow:hidden;pointer-events:none}

@keyframes glint{0%,44%,52%,100%{opacity:1}48%{opacity:.1}}
.rm .moon-glow,.rm .moon-col,.rm .clouds i,.rm .water,.rm .fire-glow,.rm .eye-glint{animation:none!important}
@media (prefers-reduced-motion:reduce){.moon-glow,.moon-col,.clouds i,.water,.fire-glow,.eye-glint{animation:none!important}}

.scene{position:fixed;animation:sceneIn 2.4s ease-out both}
@keyframes sceneIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 30% 30%,transparent 40%,rgba(5,0,1,.6) 100%),linear-gradient(90deg,rgba(6,0,1,.72),rgba(6,0,1,.25) 42%,transparent 60%)}

.card.shake{animation:shake .45s}

input{width:100%;font:17px "Crimson Pro",serif;color:#ffe6cc;background:rgba(10,1,2,.85);border:1px solid #5a1216;padding:13px 70px 13px 14px;border-radius:3px;outline:none}

.err{color:#ffab8f;font-style:italic;margin:0 0 12px}

 .vign{background:linear-gradient(rgba(6,0,1,.55),rgba(6,0,1,.15) 48%,transparent 60%,rgba(6,0,1,.5))}
 .wrap{align-items:flex-start;justify-content:center;padding:9vh 22px 20px;text-align:center}
 h1{font-size:clamp(34px,10vw,52px)}
 .lede{font-size:18px;margin:10px 0 18px}

}

document.getElementById("gate-form").addEventListener("submit",async function(e){e.preventDefault();err.hidden=true;btn.disabled=true;btn.textContent="Verifying…";
  const r=await staticrypt.handleDecryptionOfPage(inp.value.trim(),true);
  if(!r.isSuccessful){showForm();err.hidden=false;card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");inp.focus();inp.select()}});
if(sessionStorage.getItem("staticrypt_passphrase")){ct.hidden=true;ld.hidden=false;window.addEventListener("load",async function(){const r=await staticrypt.handleDecryptOnLoad();if(!r.isSuccessful)showForm()})}
</script>

  var n=Math.round(w*h*this.hz/2600*this.density);n=Math.min(n,900);this.stars=[];
  for(var i=0;i<n;i++){var y=Math.pow(Math.random(),1.3)*this.hz*h*.96;this.stars.push({x:Math.random()*w,y:y,r:Math.random()<.08?rnd(1.1,1.8):rnd(.35,1),ph:rnd(0,6.3),sp:rnd(.6,2.4),a:rnd(.35,1),hue:Math.random()<.7?0:1})}
  this.gl=[];if(this.fr.hasAttribute("data-water")&&this.hz<.97){var g=Math.round(w/14);for(i=0;i<g;i++){var mx=this.moon&&Math.random()<.6?this.moon[0]*w+rnd(-.05,.05)*w:Math.random()*w;var yy=this.hz*h+Math.pow(Math.random(),1.6)*h*.32;this.gl.push({x:mx,y:yy,l:rnd(3,14)*(1+(yy/h-this.hz)*3),ph:rnd(0,6.3),sp:rnd(1,3)})}}
};
Scene.prototype.draw=function(dt){
  var x=this.x,w=this.w,h=this.h,t=this.t+=dt,S=still();x.clearRect(0,0,w,h);
  for(var i=0;i<this.stars.length;i++){var s=this.stars[i];var a=S?s.a*.8:s.a*(.55+.45*Math.sin(t*s.sp+s.ph));
    x.fillStyle=s.hue?"rgba(255,226,214,"+a+")":"rgba(255,170,160,"+a+")";x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();
    if(s.r>1.1&&!S){x.fillStyle="rgba(255,120,110,"+(a*.18)+")";x.beginPath();x.arc(s.x,s.y,s.r*3.2,0,6.283);x.fill()}}
  if(!S&&this.hz<1.01){this.nextShoot-=dt;if(this.nextShoot<=0&&this.hz>.25){this.nextShoot=rnd(3,8);this.shoot.push({x:rnd(.1,.9)*w,y:rnd(.03,.6)*this.hz*h,vx:rnd(-1,1)<0?-rnd(380,620):rnd(380,620),vy:rnd(120,240),life:0,max:rnd(.6,1.1)})}
    for(i=this.shoot.length-1;i>=0;i--){var p=this.shoot[i];p.life+=dt;if(p.life>p.max){this.shoot.splice(i,1);continue}
      var k=1-p.life/p.max,nx=p.x+p.vx*p.life,ny=p.y+p.vy*p.life,tx=nx-p.vx*.12,ty=ny-p.vy*.12;
      var gr=x.createLinearGradient(nx,ny,tx,ty);gr.addColorStop(0,"rgba(255,235,225,"+k+")");gr.addColorStop(1,"rgba(255,80,60,0)");
      x.strokeStyle=gr;x.lineWidth=1.6;x.beginPath();x.moveTo(nx,ny);x.lineTo(tx,ty);x.stroke()}}
  for(i=0;i<this.gl.length;i++){var g=this.gl[i];var ga=S?.25:Math.max(0,Math.sin(t*g.sp+g.ph));if(ga<.05)continue;
    x.strokeStyle="rgba(255,150,130,"+(ga*.45)+")";x.lineWidth=1;x.beginPath();x.moveTo(g.x-g.l/2+(S?0:Math.sin(t*.7+g.ph)*4),g.y);x.lineTo(g.x+g.l/2+(S?0:Math.sin(t*.7+g.ph)*4),g.y);x.stroke()}
  if(this.fire){var fx=this.fire[0]*w,fy=this.fire[1]*h,sc=Math.max(.6,w/1400);
    if(!S&&this.emb.length<(w<700?50:110)&&Math.random()<.9)this.emb.push({x:fx+rnd(-18,18)*sc,y:fy,vx:rnd(-12,12),vy:rnd(40,110)*sc,life:0,max:rnd(1.6,4.2),r:rnd(.7,2.1)*sc,ph:rnd(0,6.3)});
    for(i=this.emb.length-1;i>=0;i--){var e=this.emb[i];e.life+=dt;if(e.life>e.max){this.emb.splice(i,1);continue}
      e.ph+=dt*2;e.x+=(e.vx+Math.sin(e.ph)*14)*dt;e.y-=e.vy*dt;var ea=(1-e.life/e.max);
      x.fillStyle="rgba(255,"+(120+Math.round(100*ea))+",60,"+ea+")";x.beginPath();x.arc(e.x,e.y,e.r,0,6.283);x.fill();
      x.fillStyle="rgba(255,90,30,"+(ea*.2)+")";x.beginPath();x.arc(e.x,e.y,e.r*3,0,6.283);x.fill()}}
};
function init(){[].forEach.call(D.querySelectorAll(".sframe[data-sky]"),function(f){if(!f._sc){f._sc=new Scene(f);scenes.push(f._sc)}})}
var last=0;
function loop(ts){var dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;
  for(var i=0;i<scenes.length;i++){var s=scenes[i];if(s.vis&&s.fr.offsetParent!==null){s.size();s.draw(dt)}}
  requestAnimationFrame(loop)}
var rt;W.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){scenes.forEach(function(s){s.w=0;if(s.vis)s.size()})},150)});
init();requestAnimationFrame(loop);
W.VerminScenes={init:init};
})();

</script>
